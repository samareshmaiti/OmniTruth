server.port=8081
spring.application.name=omnitruth-super-admin-service
# POSTGRESQL DATASOURCE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnitruth_platform_admin}
spring.datasource.username=${DB_USERNAME:omnitruth}
spring.datasource.password=${DB_PASSWORD:change-me}
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# FLYWAY
spring.flyway.enabled=true
# OAUTH2 CLIENT - USER MANAGEMENT

spring.security.oauth2.client.registration.user-management.provider=platform-idp
spring.security.oauth2.client.registration.user-management.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.user-management.client-id=${USER_MGMT_CLIENT_ID}
spring.security.oauth2.client.registration.user-management.client-secret=${USER_MGMT_CLIENT_SECRET}
spring.security.oauth2.client.registration.user-management.scope=users.invite
# OAUTH2 CLIENT - AUDIT MANAGEMENT
spring.security.oauth2.client.registration.audit-management.provider=platform-idp
spring.security.oauth2.client.registration.audit-management.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.audit-management.client-id=${AUDIT_MGMT_CLIENT_ID}
spring.security.oauth2.client.registration.audit-management.client-secret=${AUDIT_MGMT_CLIENT_SECRET}
spring.security.oauth2.client.registration.audit-management.scope=audit.write
# OAUTH2 PROVIDER - PLATFORM IDP
spring.security.oauth2.client.provider.platform-idp.token-uri=${IDP_TOKEN_URI}
# OMNITRUTH SECURITY
omnitruth.security.issuer-uri=${IDP_ISSUER_URI}
omnitruth.security.required-audience=${PLATFORM_API_AUDIENCE:omnitruth-platform-api}
# MICROSERVICE URLS
services.user-management.base-url=${USER_MANAGEMENT_BASE_URL:http://localhost:8082}
services.audit-management.base-url=${AUDIT_MANAGEMENT_BASE_URL:http://localhost:8084}
# ACTUATOR / MONITORING
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

